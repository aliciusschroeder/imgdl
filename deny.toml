# `cargo deny check` — run by `just audit` and by CI.
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Everything in the current tree is one of these. A new dependency with a
# different licence is a decision, so it should fail the build until someone
# makes it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# ring is MIT/ISC/OpenSSL; the OpenSSL part covers vendored BoringSSL code.
name = "ring"
allow = ["OpenSSL", "MIT", "ISC"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
