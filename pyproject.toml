# ---------------------------------------------------------------------------
# This file lives at the repo ROOT on purpose.
#
# It is what makes the headline install path work with no fragment:
#
#     uv add git+https://github.com/aliciusschroeder/imgdl
#
# If it lived under crates/imgdl-py/, every consumer would need
# `#subdirectory=crates/imgdl-py` and maturin's sdist generation for a
# workspace member gets noticeably fussier. `manifest-path` below points
# maturin at the binding crate instead.
# ---------------------------------------------------------------------------
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "imgdl"
description = "Fast concurrent image downloader: HTTP/2 multiplexing, connection pooling and DNS caching, in Rust."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["version"] # maturin reads it from Cargo.toml
authors = [{ name = "Alicius Schröder" }]
keywords = ["download", "images", "http2", "concurrent", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
imgdl = "imgdl.__main__:main"

[project.urls]
Homepage = "https://github.com/aliciusschroeder/imgdl"
Repository = "https://github.com/aliciusschroeder/imgdl"
Changelog = "https://github.com/aliciusschroeder/imgdl/blob/main/CHANGELOG.md"
Issues = "https://github.com/aliciusschroeder/imgdl/issues"

[tool.maturin]
manifest-path = "crates/imgdl-py/Cargo.toml"
module-name = "imgdl._imgdl"
python-source = "python"                     # mandatory for the mixed layout; without it
# the .pyi and py.typed never ship
features = [
    "pyo3/extension-module",
] # ONLY enabled here — see imgdl-py/Cargo.toml
strip = true
include = [{ path = "python/imgdl/_imgdl.pyi", format = "wheel" }]

# --------------------------------------------------------------------------
# Dev environment
# --------------------------------------------------------------------------
[dependency-groups]
dev = [
    "maturin>=1.9,<2.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
bench = ["pytest-benchmark>=4.0"]

[tool.uv]
# Without this, uv happily serves a stale compiled extension after you edit
# Rust: `uv sync` sees an unchanged pyproject.toml and skips the rebuild.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.lock" },
    { file = "**/Cargo.toml" },
    { file = "**/*.rs" },
]
# The project builds itself from Rust; keep it installed editable-ish so the
# `python/` sources are picked up without a reinstall.
default-groups = ["dev"]

# --------------------------------------------------------------------------
# Test / lint / type config
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "network: test reaches the public internet (deselect with '-m \"not network\"')",
    "slow: test takes more than a second",
]
timeout = 120
filterwarnings = ["error"]

[tool.coverage.run]
source = ["imgdl"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "\\.\\.\\."]
show_missing = true

[tool.ruff]
line-length = 95
target-version = "py310"
extend-exclude = ["python/imgdl/_imgdl.pyi"] # generated

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "SIM",
    "C4",
    "PIE",
    "DTZ",
    "PT",
    "ANN",
    "TID",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests and benchmarks: fixtures are untyped by convention, asserts are the point.
"tests/**" = ["ANN", "S101", "PT018"]
"benches/**" = ["ANN", "S101"]
"examples/**" = ["ANN", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
# Strict where it ships. `python/` is the published surface, and `scripts/` is
# release machinery where a typo costs a bad tag.
files = ["python", "scripts"]
# The extension module is described entirely by its generated stub, which is
# committed and drift-checked, so a missing-import error here means the stub
# was not regenerated rather than that the module is untyped.
[[tool.mypy.overrides]]
module = "imgdl._imgdl"
ignore_missing_imports = false

# Tests, benches and examples are deliberately outside `files`: they are checked
# by running them, and requiring full annotations on every fixture buys noise
# rather than safety. `just lint` still runs ruff over all of them.
