version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]
      pyo3:
        patterns: ["pyo3*"] # pyo3 and pyo3-stub-gen must move together

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-dev:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
